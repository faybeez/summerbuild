<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Elytsx OTP Code</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FAF5F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2D2422;
      -webkit-font-smoothing: antialiased;
    }
    
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #FAF5F0;
      padding: 40px 20px;
    }

    .main-container {
      max-width: 500px;
      margin: 0 auto;
      background-color: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }

    .header {
      padding: 40px 40px 20px 40px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #31231E;
      margin: 0;
    }

    .content {
      padding: 20px 40px 40px 40px;
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #31231E;
    }

    .message {
      font-size: 15px;
      line-height: 1.5;
      color: #6B5E59;
      margin-bottom: 30px;
    }

    .otp-container {
      background-color: #FAF5F0;
      border-radius: 12px;
      padding: 20px;
      margin: 0 auto 30px auto;
      display: inline-block;
      min-width: 200px;
    }

    .otp-code {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #31231E;
      margin: 0;
    }

    .footer {
      padding: 20px 40px 30px 40px;
      text-align: center;
      border-top: 1px solid #F0EBE6;
    }

    .footer-text {
      font-size: 13px;
      color: #9C8F8A;
      line-height: 1.4;
      margin: 0;
    }

    @media screen and (max-width: 480px) {
      .main-container {
        border-radius: 16px;
      }
      .content, .header, .footer {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table class="main-container" width="100%" cellspacing="0" cellpadding="0" border="0" align="center">
      <tr>
        <td class="header">
          <h1 class="logo">Elytsx</h1>
        </td>
      </tr>
      <tr>
        <td class="content">
          <div class="title">Verify your email</div>
          <p class="message">You are almost ready to start curating your wardrobe. Enter the confirmation code below to sign in to your account.</p>
          
          <div class="otp-container">
            <p class="otp-code">{{ .Token }}</p>
          </div>
          
          <p class="message" style="font-size: 14px; margin-bottom: 0;">This code will expire in 10 minutes.</p>
        </td>
      </tr>
      <tr>
        <td class="footer">
          <p class="footer-text">If you didn't request this email, there's nothing to worry about. You can safely ignore it.</p>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
